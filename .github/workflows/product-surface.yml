# Notice when a merged product change makes the 2.1 preview wrong.
#
# `build.yml` proves the site compiles and every link resolves. It cannot tell
# that a page is describing software that no longer exists — the site builds
# perfectly either way. Three verification rounds in a row have found exactly
# that, and twice the product PR responsible had merged within the same day.
#
# THIS IS A MONITOR, NOT A GATE, and that is deliberate.
#
# It installs recotem from the product's `main`, so it goes red the moment a
# product change lands ahead of the docs — which is the signal we want, and
# exactly the wrong thing to hang across an unrelated documentation PR. So it
# does not run on `pull_request`. It runs daily, on pushes to main, and on
# demand.
#
# Pinning a product commit instead would make it safe to run on every PR, and
# would also make it useless: it would stay green while the product moved on,
# which is the failure this exists to catch. The pin only becomes viable if
# something bumps it — the natural place is recotem's own release flow.
#
# The stronger version of this check belongs in the *product* repo, where a PR
# that changes `serving/routes.py` or `serving/schemas.py` could be asked to
# show the matching docs change before it merges. That is a cross-repo change
# and is not proposed here.
name: product-surface

on:
  schedule:
    # 03:00 UTC daily — after the product repo's own nightly window.
    - cron: '0 3 * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: product-surface-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `cache: pip`. This repository has no requirements.txt and no
      # pyproject.toml, and setup-python treats a cache with nothing to key on
      # as a hard error ("No file ... matched to [**/requirements.txt or
      # **/pyproject.toml]"), which killed this job before it installed
      # anything. There is nothing to cache here anyway: the one dependency is
      # installed from a git ref that moves.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The metrics extra is what registers /v1/metrics; without it the
      # endpoint the site documents would not exist to compare against.
      - name: Install recotem from product main
        run: |
          python -m pip install --upgrade pip
          python -m pip install "recotem[metrics] @ git+https://github.com/codelibs/recotem@main"

      - name: Report the installed build
        run: |
          python -c "import recotem; print('recotem', recotem.__version__)"

      # Once per language. Checking `2.1/` as one tree concatenates every page
      # in both languages, so a surface documented only in Japanese counts as
      # documented in English and vice versa -- the whole English
      # environment-variables page could be deleted with the job still green.
      - name: Check the 2.1 preview (English) against it
        id: drift_en
        run: python scripts/check_product_surface.py --tree 2.1 --exclude ja

      - name: Check the 2.1 preview (Japanese) against it
        id: drift_ja
        if: always()
        run: python scripts/check_product_surface.py --tree 2.1/ja

      # Distinguish "the product drifted" from "this job broke".
      #
      # Both are a red X, and for a monitor that is a real problem: a drift
      # checker going red is exactly what a working drift checker looks like.
      # This job spent its entire life red without ever running the check --
      # setup-python failed, the three steps that matter reported no
      # conclusion at all, and a red X on a newly added drift monitor is
      # plausible enough to be read as "it found something".
      #
      # A step that never ran has no `outcome`; one that ran has `success` or
      # `failure`. So anything else here means the job died on the way.
      - name: The check must actually have run
        if: always()
        env:
          EN: ${{ steps.drift_en.outcome }}
          JA: ${{ steps.drift_ja.outcome }}
        run: |
          fatal=0
          for pair in "English:$EN" "Japanese:$JA"; do
            lang=${pair%%:*}
            outcome=${pair#*:}
            case "$outcome" in
              success|failure) ;;
              *)
                echo "::error::the $lang drift check never executed" \
                     "(outcome='$outcome'). This is an infrastructure failure" \
                     "in this workflow, NOT documentation drift -- fix the job," \
                     "do not go looking for a stale page."
                fatal=1
                ;;
            esac
          done
          exit "$fatal"
